{% extends "base.html" %}{% from "_macros.html" import password_field with context %}{% block content %}
<div class="card" style="max-width:460px;margin:24px auto"><h3>{{ _('reset.title') }}</h3>
{% if error %}<p class="high" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/reset"><input type="hidden" name="token" value="{{ token }}">
<p>{{ password_field('password', _('reset.password_ph'), 'new-password', 10) }}</p>
<button>{{ _('ui.save') }}</button></form></div>
{% endblock %}
