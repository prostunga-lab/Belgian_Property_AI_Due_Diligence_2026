{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:460px;margin:24px auto"><h3>Nouveau mot de passe</h3>
{% if error %}<p class="high" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/reset"><input type="hidden" name="token" value="{{ token }}">
<p><input name="password" type="password" minlength="10" placeholder="Nouveau mot de passe (10 caractères min.)" autocomplete="new-password" required style="width:100%"></p>
<button>Enregistrer</button></form></div>
{% endblock %}
