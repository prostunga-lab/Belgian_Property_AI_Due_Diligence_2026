{% extends "base.html" %}{% block content %}
{% if error %}<p class="high" role="alert">{{ error }}</p>{% endif %}{% if info %}<p class="ok">{{ info }}</p>{% endif %}
<div class="row" style="align-items:flex-start">
<form method="post" action="/login" class="card" style="flex:1;min-width:260px"><h3>{{ _('auth.login.title') }}</h3>
<p><input name="email" type="email" placeholder="{{ _('auth.email') }}" aria-label="{{ _('auth.email') }}" autocomplete="username" required style="width:100%"></p>
<p><input name="password" type="password" placeholder="{{ _('auth.password') }}" aria-label="{{ _('auth.password') }}" autocomplete="current-password" required style="width:100%"></p>
<div class="row"><button>{{ _('auth.login.button') }}</button><a href="/forgot" class="mut">{{ _('auth.forgot_link') }}</a></div></form>
<form method="post" action="/register" class="card" style="flex:1;min-width:260px"><h3>{{ _('auth.register.title') }}</h3>
<p class="mut">{{ _('auth.register.hint') }}</p>
<p><input name="org_name" placeholder="{{ _('auth.org_name') }}" aria-label="{{ _('auth.org_name') }}" required style="width:100%"></p>
<p><input name="email" type="email" placeholder="{{ _('auth.email') }}" aria-label="{{ _('auth.email') }}" autocomplete="username" required style="width:100%"></p>
{% if invite %}<p><input name="invite_code" placeholder="{{ _('auth.invite_code') }}" aria-label="{{ _('auth.invite_code') }}" required style="width:100%"></p>{% endif %}
<p><input name="password" type="password" minlength="10" placeholder="{{ _('auth.password_new') }}" aria-label="{{ _('auth.password_new') }}" autocomplete="new-password" required style="width:100%"></p>
<button>{{ _('auth.register.button') }}</button></form>
</div>{% endblock %}
