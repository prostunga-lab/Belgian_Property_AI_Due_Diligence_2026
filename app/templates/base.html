<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Property Due Diligence{% endblock %}</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--bd:#e2e8f0;--acc:#1d4ed8;--high:#b91c1c;--medium:#c2410c;--low:#a16207;--info:#475569}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--fg:#e2e8f0;--mut:#94a3b8;--card:#111a2e;--bd:#25314d;--acc:#60a5fa;--high:#f87171;--medium:#fb923c;--low:#facc15;--info:#94a3b8}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
a{color:var(--acc)} .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
input,select,textarea,button{box-sizing:border-box;max-width:100%;font:inherit;padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer} button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:13px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.high{color:var(--high)}.medium{color:var(--medium)}.low{color:var(--low)}.info{color:var(--info)}
.ok{color:#15803d}.warn{background:#fef3c7;color:#78350f;border-color:#fcd34d}@media (prefers-color-scheme:dark){.ok{color:#4ade80}.warn{background:#3b2f0b;color:#fde68a;border-color:#92400e}}code{background:var(--bd);padding:1px 5px;border-radius:4px;word-break:break-all}.langbtn{padding:2px 7px;border-radius:6px;font-size:12px;text-decoration:none;border:1px solid var(--bd);color:var(--mut)}.langbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
blockquote{margin:4px 0;padding:2px 10px;border-left:3px solid var(--bd);color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
</style></head><body>
<header><a href="/" style="text-decoration:none;color:inherit"><b>🏠 Belgian Property Due Diligence</b></a>
<div class="row">
<nav class="row" aria-label="{{ _('ui.language') }}" style="gap:2px">{% for code in languages %}<a href="/lang/{{ code }}?next={{ switch_next|urlencode }}" class="langbtn{{ ' on' if code == lang }}" hreflang="{{ code }}" lang="{{ code }}" {{ 'aria-current=true' if code == lang }} title="{{ lang_names[code] }}">{{ code|upper }}</a>{% endfor %}</nav>
{% if user is defined and user %}<a href="/account">{{ user.email }}</a>{% if org is defined and org %}<span class="badge info">{{ _('ui.credits', n=org.credits) }}</span>{% endif %}
<form method="post" action="/logout"><button class="sec">{{ _('nav.logout') }}</button></form>{% endif %}</div></header>
<main>{% block content %}{% endblock %}</main>
<footer><main class="mut">{{ _('ui.disclaimer') }}</main></footer>
</body></html>
