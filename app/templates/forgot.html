{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:460px;margin:24px auto"><h3>{{ _('forgot.title') }}</h3>
{% if sent %}<p>{{ _('forgot.sent') }}</p><p><a href="/login">← {{ _('forgot.back') }}</a></p>
{% else %}<form method="post" action="/forgot"><p><input name="email" type="email" placeholder="{{ _('forgot.email_ph') }}" aria-label="{{ _('auth.email') }}" required style="width:100%"></p><button>{{ _('forgot.send') }}</button> <a href="/login" class="mut">{{ _('ui.cancel') }}</a></form>{% endif %}</div>
{% endblock %}
