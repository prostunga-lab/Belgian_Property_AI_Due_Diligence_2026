{# Password input with a show/hide toggle. The toggle is progressive enhancement: hidden until JavaScript runs (see base.html). #}
{% macro password_field(name="password", placeholder="", autocomplete="current-password", minlength=None, style="width:100%") %}
<span class="pw"><input name="{{ name }}" type="password" placeholder="{{ placeholder }}" aria-label="{{ placeholder }}" autocomplete="{{ autocomplete }}"{% if minlength %} minlength="{{ minlength }}"{% endif %} required style="{{ style }}"><button type="button" class="pwtoggle" aria-pressed="false" aria-label="{{ _('ui.password.show') }}" title="{{ _('ui.password.show') }}" data-show="{{ _('ui.password.show') }}" data-hide="{{ _('ui.password.hide') }}"><svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg></button></span>
{% endmacro %}
