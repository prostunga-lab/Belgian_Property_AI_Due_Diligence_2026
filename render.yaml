# Production-like deployment on Render (https://render.com): New + > Blueprint > pick this repo.
# Persistent: managed PostgreSQL (accounts, cases, findings) + persistent disk (uploaded files, encrypted at rest).
# Paid plans are required for persistence. Check current plan names/prices in the Render dashboard before applying.
databases:
  - name: belgian-property-db
    plan: basic-256mb
    region: frankfurt          # EU data residency (GDPR)
    databaseName: dd
    user: dd

services:
  - type: web
    name: belgian-property-dd
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    disk:                      # a disk pins the service to one instance (fine: login throttling is per-process)
      name: uploads
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production      # app refuses to start without the secrets below
      - key: DATABASE_URL
        fromDatabase:
          name: belgian-property-db
          property: connectionString
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FILE_ENCRYPTION_KEY   # BACK THIS UP (password manager): without it uploaded files are unrecoverable
        generateValue: true
      - key: INVITE_CODE           # share only with people who may create an account
        generateValue: true
      - key: RETENTION_DAYS
        value: "365"
      - key: FREE_CREDITS          # credits granted to each new organisation (1 credit = 1 document)
        value: "3"
      - key: PACK_CREDITS          # credits added per Stripe purchase
        value: "20"
      - key: ANTHROPIC_API_KEY     # optional: AI reading + field filling; without it the app is 100% rule-based
        sync: false
      # E-mail (confirmation, password reset). Without SMTP_HOST links are only written to the server log,
      # e-mail confirmation is not enforced and password reset cannot reach users: configure it before opening to others.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Stripe (optional): see docs/DEPLOY.md
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
