name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pw, POSTGRES_DB: dd}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-fra tesseract-ocr-eng poppler-utils
      - run: pip install -r requirements.txt
      - name: Tests
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:pw@localhost:5432/dd' || '' }}
        run: |
          [ -z "$DATABASE_URL" ] && unset DATABASE_URL
          pytest -q
